```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단어 암기</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app" class="container text-center">

        <h1 class="text-4xl font-bold mb-8">
            단어 암기
        </h1>

        <!-- 단어 -->
        <h2 id="history-question-text" class="text-3xl font-bold mb-8">
            tree
        </h2>

        <!-- 정답 입력 -->
        <input
            type="text"
            id="history-answer-input"
            placeholder="뜻을 입력하세요"
            class="input-box text-xl"
        >

        <!-- 결과 -->
        <div
            id="history-result-message"
            class="mt-4 text-2xl"
        ></div>

        <!-- 확인 버튼 -->
        <button
            class="btn btn-primary text-lg mt-8"
            onclick="checkHistoryAnswer()"
        >
            정답 확인
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
