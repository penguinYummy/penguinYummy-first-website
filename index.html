<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>일본어 학습</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --navy: #172033;
            --blue: #3157d5;
            --light-blue: #eef2ff;
            --text: #202636;
            --sub-text: #7c8496;
            --line: #e5e8ef;
            --background: #f5f6fa;
            --white: #ffffff;
            --correct: #16875d;
            --correct-bg: #eaf8f2;
            --wrong: #d94b4b;
            --wrong-bg: #fff0f0;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #e8edff 0%,
                    transparent 35%
                ),
                var(--background);

            color: var(--text);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        /* 전체 카드 */

        .quiz-container {
            width: 100%;
            max-width: 680px;

            background: var(--white);

            border: 1px solid rgba(20, 30, 50, 0.06);

            border-radius: 28px;

            padding: 42px;

            box-shadow:
                0 20px 60px rgba(26, 36, 60, 0.10),
                0 3px 10px rgba(26, 36, 60, 0.04);
        }

        /* 상단 */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 28px;
        }

        .logo {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--navy);
        }

        .counter {
            font-size: 14px;
            font-weight: 700;
            color: var(--sub-text);
        }

        /* 진행률 */

        .progress-container {
            width: 100%;
            height: 7px;

            background: #edf0f5;

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 45px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;

            background: var(--blue);

            border-radius: 20px;

            transition: width 0.35s ease;
        }

        /* 문제 영역 */

        .question-label {
            text-align: center;

            font-size: 14px;
            font-weight: 700;

            color: var(--sub-text);

            margin-bottom: 15px;
        }

        .katakana {
            height: 170px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                "Noto Sans JP",
                "Yu Gothic",
                sans-serif;

            font-size: 120px;
            font-weight: 600;

            color: var(--navy);

            margin-bottom: 25px;

            user-select: none;
        }

        .question {
            text-align: center;

            font-size: 18px;
            font-weight: 700;

            margin-bottom: 25px;
        }

        /* 선택지 */

        .answers {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 13px;
        }

        .answer {
            position: relative;

            min-height: 72px;

            padding: 15px;

            border: 1.5px solid var(--line);

            border-radius: 15px;

            background: #fff;

            color: var(--text);

            font-size: 20px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        .answer:hover:not(:disabled) {
            transform: translateY(-2px);

            border-color: #b9c3e9;

            background: #fafbff;

            box-shadow:
                0 7px 18px rgba(30, 45, 90, 0.08);
        }

        .answer:active:not(:disabled) {
            transform: translateY(0);
        }

        .answer:disabled {
            cursor: default;
        }

        /* 정답 */

        .answer.correct {
            color: var(--correct);

            background: var(--correct-bg);

            border-color: #62c39c;

            animation: correctPop 0.25s ease;
        }

        /* 오답 */

        .answer.wrong {
            color: var(--wrong);

            background: var(--wrong-bg);

            border-color: #e89090;

            animation: wrongShake 0.3s ease;
        }

        @keyframes correctPop {
            0% {
                transform: scale(0.97);
            }

            60% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes wrongShake {
            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        /* 결과 */

        .result {
            min-height: 27px;

            margin-top: 22px;

            text-align: center;

            font-size: 16px;
            font-weight: 700;
        }

        /* 다음 버튼 */

        .next-btn {
            display: none;

            width: 100%;

            margin-top: 18px;

            padding: 16px;

            border: none;
            border-radius: 14px;

            background: var(--navy);

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .next-btn:hover {
            background: #25304a;

            transform: translateY(-1px);
        }

        /* 결과 화면 */

        .finish-title {
            font-size: 15px;
            font-weight: 700;

            color: var(--sub-text);

            margin-bottom: 12px;
        }

        .finish-score {
            font-size: 58px;
            font-weight: 800;

            color: var(--navy);

            margin-bottom: 10px;
        }

        .finish-message {
            font-size: 16px;
            color: var(--sub-text);

            margin-bottom: 30px;
        }

        /* 모바일 */

        @media (max-width: 600px) {

            body {
                padding: 16px;
            }

            .quiz-container {
                padding: 28px 20px;

                border-radius: 22px;
            }

            .progress-container {
                margin-bottom: 30px;
            }

            .katakana {
                height: 140px;

                font-size: 95px;
            }

            .answer {
                min-height: 65px;

                font-size: 18px;
            }

            .header {
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <div class="header">
        <div class="logo">KATAKANA</div>
        <div class="counter" id="progress">1 / 46</div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="katakana" id="katakana"></div>

    <div class="question">
        이 문자의 발음은 무엇일까요?
    </div>

    <div class="answers" id="answers"></div>

    <div class="result" id="result"></div>

    <button
        class="next-btn"
        id="nextBtn"
        onclick="nextQuestion()"
    >
        다음 문제
    </button>

</div>


<script>

    /* =========================
       가타카나 데이터
    ========================= */

    const kanaData = [

        { kana: "ア", answer: "아" },
        { kana: "イ", answer: "이" },
        { kana: "ウ", answer: "우" },
        { kana: "エ", answer: "에" },
        { kana: "オ", answer: "오" },

        { kana: "カ", answer: "카" },
        { kana: "キ", answer: "키" },
        { kana: "ク", answer: "쿠" },
        { kana: "ケ", answer: "케" },
        { kana: "コ", answer: "코" },

        { kana: "サ", answer: "사" },
        { kana: "シ", answer: "시" },
        { kana: "ス", answer: "스" },
        { kana: "セ", answer: "세" },
        { kana: "ソ", answer: "소" },

        { kana: "タ", answer: "타" },
        { kana: "チ", answer: "치" },
        { kana: "ツ", answer: "츠" },
        { kana: "テ", answer: "테" },
        { kana: "ト", answer: "토" },

        { kana: "ナ", answer: "나" },
        { kana: "ニ", answer: "니" },
        { kana: "ヌ", answer: "누" },
        { kana: "ネ", answer: "네" },
        { kana: "ノ", answer: "노" },

        { kana: "ハ", answer: "하" },
        { kana: "ヒ", answer: "히" },
        { kana: "フ", answer: "후" },
        { kana: "ヘ", answer: "헤" },
        { kana: "ホ", answer: "호" },

        { kana: "マ", answer: "마" },
        { kana: "ミ", answer: "미" },
        { kana: "ム", answer: "무" },
        { kana: "メ", answer: "메" },
        { kana: "モ", answer: "모" },

        { kana: "ヤ", answer: "야" },
        { kana: "ユ", answer: "유" },
        { kana: "ヨ", answer: "요" },

        { kana: "ラ", answer: "라" },
        { kana: "リ", answer: "리" },
        { kana: "ル", answer: "루" },
        { kana: "レ", answer: "레" },
        { kana: "ロ", answer: "로" },

        { kana: "ワ", answer: "와" },
        { kana: "ヲ", answer: "오" },
        { kana: "ン", answer: "응" }

    ];


    /* =========================
       변수
    ========================= */

    let currentQuestion = 0;
    let score = 0;
    let questions = [];


    /* =========================
       배열 섞기
    ========================= */

    function shuffle(array) {

        for (let i = array.length - 1; i > 0; i--) {

            const j = Math.floor(Math.random() * (i + 1));

            [array[i], array[j]] =
                [array[j], array[i]];
        }

        return array;
    }


    /* =========================
       퀴즈 시작
    ========================= */

    function startQuiz() {

        questions = shuffle([...kanaData]);

        currentQuestion = 0;
        score = 0;

        showQuestion();
    }


    /* =========================
       문제 출력
    ========================= */

    function showQuestion() {

        const question =
            questions[currentQuestion];

        /* 진행률 */

        document.getElementById("progress").textContent =
            `${currentQuestion + 1} / ${questions.length}`;


        const progressPercent =
            ((currentQuestion) / questions.length) * 100;

        document.getElementById("progressBar").style.width =
            `${progressPercent}%`;


        /* 가타카나 */

        document.getElementById("katakana").textContent =
            question.kana;


        /* 결과 초기화 */

        document.getElementById("result").textContent = "";


        /* 다음 버튼 숨기기 */

        document.getElementById("nextBtn").style.display =
            "none";


        /* 선택지 */

        const answers =
            document.getElementById("answers");

        answers.innerHTML = "";


        /* 정답 */

        let choices = [
            question.answer
        ];


        /* 오답 */

        const wrongAnswers = kanaData
            .filter(item =>
                item.answer !== question.answer
            )
            .map(item =>
                item.answer
            );


        shuffle(wrongAnswers);


        choices.push(
            wrongAnswers[0],
            wrongAnswers[1],
            wrongAnswers[2]
        );


        shuffle(choices);


        /* 버튼 생성 */

        choices.forEach(choice => {

            const button =
                document.createElement("button");

            button.className = "answer";

            button.textContent = choice;

            button.onclick = () =>
                checkAnswer(button, choice);

            answers.appendChild(button);

        });

    }


    /* =========================
       정답 확인
    ========================= */

    function checkAnswer(button, choice) {

        const correctAnswer =
            questions[currentQuestion].answer;


        const buttons =
            document.querySelectorAll(".answer");


        /* 중복 클릭 방지 */

        buttons.forEach(btn => {
            btn.disabled = true;
        });


        /* 정답 */

        if (choice === correctAnswer) {

            button.classList.add("correct");

            document.getElementById("result").textContent =
                "정답입니다.";

            document.getElementById("result").style.color =
                "var(--correct)";

            score++;

        }


        /* 오답 */

        else {

            button.classList.add("wrong");

            document.getElementById("result").textContent =
                `정답은 「${correctAnswer}」입니다.`;

            document.getElementById("result").style.color =
                "var(--wrong)";


            buttons.forEach(btn => {

                if (btn.textContent === correctAnswer) {

                    btn.classList.add("correct");

                }

            });

        }


        /* 다음 버튼 */

        document.getElementById("nextBtn").style.display =
            "block";

    }


    /* =========================
       다음 문제
    ========================= */

    function nextQuestion() {

        currentQuestion++;


        /* 마지막 */

        if (currentQuestion >= questions.length) {

            showFinish();

        }


        /* 다음 문제 */

        else {

            showQuestion();

        }

    }


    /* =========================
       결과 화면
    ========================= */

    function showFinish() {

        document.querySelector(".question-label").textContent =
            "QUIZ COMPLETE";

        document.getElementById("katakana").innerHTML =
            `<div>
                <div class="finish-title">최종 점수</div>
                <div class="finish-score">
                    ${score} / ${questions.length}
                </div>
            </div>`;


        document.getElementById("progress").textContent =
            "완료";


        document.getElementById("progressBar").style.width =
            "100%";


        document.getElementById("answers").innerHTML =
            "";


        document.getElementById("result").textContent =
            "";


        const nextBtn =
            document.getElementById("nextBtn");


        nextBtn.textContent =
            "다시 시작";

        nextBtn.style.display =
            "block";

        nextBtn.onclick =
            startQuiz;

    }


    /* =========================
       실행
    ========================= */

    startQuiz();

</script>

</body>
</html>
