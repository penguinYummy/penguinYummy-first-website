<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>단어 학습</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="quiz-container">

    <div class="top-bar">
        <a class="back-link" href="index.html">목록으로</a>
    </div>

    <div class="header">
        <div class="logo">VOCABULARY</div>
        <div class="counter" id="progress">1 / 29</div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question-label">이 단어의 뜻은 무엇일까요?</div>

    <div class="word-display" id="wordDisplay">
        <div class="word-kanji" id="wordKanji"></div>
        <div class="word-reading" id="wordReading"></div>
    </div>

    <div class="input-area" id="inputArea">
        <input
            type="text"
            id="answerInput"
            class="answer-input"
            placeholder="뜻을 입력하고 Enter"
            autocomplete="off"
        >
        <button class="submit-btn" id="submitBtn">확인</button>
    </div>

    <div class="result" id="result"></div>

    <button class="next-btn" id="nextBtn">
        다음 문제
    </button>

</div>

<script src="js/common.js"></script>
<script src="js/vocab-data.js"></script>
<script src="js/vocab.js"></script>

</body>
</html>
